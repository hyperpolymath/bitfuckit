# This workflow is managed by gh actions-lock.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install GNAT and GPRbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat gprbuild

      - name: Build
        run: gprbuild -P bitfuckit.gpr -XBUILD_MODE=release

      - name: Create tarball
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mkdir -p dist
          tar -czvf dist/bitfuckit-${VERSION}-linux-x86_64.tar.gz \
            bin/bitfuckit \
            doc/bitfuckit.1 \
            completions/ \
            README.adoc \
            LICENSE

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
